name: Nebbie Translate (Windows portable)

on:
  workflow_dispatch:
  push:
    branches:
      - cursor/room-translator-editor-92f1
    paths:
      - "nebbie-translator/**"
      - "nebbie-core/**"
      - "scripts/package-windows-translate.ps1"
      - "scripts/prepare-windows-translate-package.ps1"
      - "scripts/build.ps1"
      - ".github/workflows/nebbie-translate-windows.yml"

permissions:
  contents: write

jobs:
  windows-portable:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch nebbietest data
        shell: pwsh
        run: ./scripts/fetch-test-data.ps1

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.5.3"
          host: windows
          target: desktop
          arch: win64_msvc2019_64

      - name: Build portable zip
        shell: pwsh
        run: ./scripts/package-windows-translate.ps1

      - name: Verify zip contents
        shell: pwsh
        run: |
          $zip = Get-ChildItem dist/nebbie-translate_*_windows_portable.zip | Select-Object -First 1
          if (-not $zip) { throw "Zip not found in dist/" }
          Expand-Archive -Path $zip.FullName -DestinationPath $env:RUNNER_TEMP/nebbie-translate-test -Force
          $exe = Join-Path $env:RUNNER_TEMP/nebbie-translate-test nebbie-translate.exe
          if (-not (Test-Path $exe)) { throw "nebbie-translate.exe missing in zip" }
          Write-Host "OK: $($zip.Name) contains nebbie-translate.exe"

      - name: Upload zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: nebbie-translate-windows-portable
          path: dist/nebbie-translate_*_windows_portable.zip
          if-no-files-found: error

      - name: Publish GitHub pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nebbie-translate-windows
          name: Nebbie Translate — Windows portable
          prerelease: true
          generate_release_notes: true
          files: dist/nebbie-translate_*_windows_portable.zip
          body: |
            ## Nebbie Translate (Windows portable)

            Editor leggero per tradurre **nome**, **descrizioni stanza**, **descrizioni extra** e **testi look uscite**.

            ### Installazione
            Nessuna installazione: estrai lo zip in una cartella e avvia `nebbie-translate.exe`.

            ### Primo avvio
            1. Avvia `nebbie-translate.exe`
            2. **File → Apri libreria** e seleziona la cartella `mudroot` o `mudroot/lib` del tuo mondo
            3. Modifica i testi e usa **Salva**

            Opzionale: trascina la cartella `lib` sull'eseguibile, oppure
            `nebbie-translate.exe D:\percorso\mudroot\lib`

            ### Requisiti
            - Windows 10/11 64-bit
            - [Microsoft Visual C++ Redistributable](https://learn.microsoft.com/en-us/cpp/windows/latest-supported-vc-redist) (di solito già presente)

            ### Config
            Percorso libreria salvato in `%APPDATA%\Nebbie\nebbie-translate.conf`
