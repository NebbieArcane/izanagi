name: Izanagi (release packages)

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  linux-deb:
    if: github.repository == 'NebbieArcane/izanagi'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch nebbietest data
        run: ./scripts/fetch-test-data.sh

      - name: Install dependencies
        run: ./scripts/install-deps.sh

      - name: Build .deb package
        run: ./scripts/package-deb.sh

      - name: Verify .deb package
        run: |
          dpkg-deb --info dist/izanagi_*.deb
          dpkg-deb --contents dist/izanagi_*.deb | grep -E 'bin/izanagi|share/nebbie-editor|icons/hicolor.*izanagi'

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: nebbie-editor-linux-deb
          path: dist/izanagi_*.deb
          if-no-files-found: error

  macos-dmg:
    if: github.repository == 'NebbieArcane/izanagi'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch nebbietest data
        run: ./scripts/fetch-test-data.sh

      - name: Install dependencies
        run: ./scripts/install-deps.sh

      - name: Build app icons
        run: |
          python3 scripts/generate-nebbie-icons.py nebbieedit

      - name: Detect Apple signing configuration
        id: apple_signing
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
        run: |
          if [[ -n "${APPLE_TEAM_ID}" && -n "${APPLE_CERTIFICATE_BASE64}" \
                && -n "${APPLE_ID}${APP_STORE_CONNECT_API_KEY_ID}" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Apple notarization secrets found — will sign with Developer ID."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Apple secrets not configured — building ad-hoc signed DMG."
            echo "Optional notarization setup: docs/MACOS_SIGNING.md"
          fi

      - name: Import Apple signing certificate
        if: steps.apple_signing.outputs.enabled == 'true'
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: ./scripts/macos-import-signing-cert.sh

      - name: Build .dmg package
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          export CMAKE_PREFIX_PATH="$(brew --prefix qt@6)"
          ./scripts/package-dmg.sh

      - name: Verify .dmg contents
        run: |
          set -euo pipefail
          hdiutil attach dist/izanagi_*_macos.dmg -mountpoint /tmp/izanagi-dmg -nobrowse
          trap 'hdiutil detach /tmp/izanagi-dmg 2>/dev/null || true' EXIT
          test -d /tmp/izanagi-dmg/Izanagi.app
          test -d /tmp/izanagi-dmg/Izanagi.app/Contents/Frameworks
          test -x /tmp/izanagi-dmg/Izanagi.app/Contents/MacOS/Izanagi
          test -f /tmp/izanagi-dmg/Izanagi.app/Contents/Resources/izanagi.icns
          test -f /tmp/izanagi-dmg/LEGGIMI.txt
          if [[ "${{ steps.apple_signing.outputs.enabled }}" == "true" ]]; then
            xcrun stapler validate /tmp/izanagi-dmg/Izanagi.app
            spctl -a -vv /tmp/izanagi-dmg/Izanagi.app
          else
            echo "Ad-hoc signed build — skipping stapler/spctl (first launch: tasto destro → Apri)."
          fi

      - name: Upload .dmg artifact
        uses: actions/upload-artifact@v4
        with:
          name: nebbie-editor-macos-dmg
          path: dist/izanagi_*_macos.dmg
          if-no-files-found: error

  windows-portable:
    if: github.repository == 'NebbieArcane/izanagi'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch nebbietest data
        shell: pwsh
        run: ./scripts/fetch-test-data.ps1

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.5.3"
          host: windows
          target: desktop
          arch: win64_msvc2019_64

      - name: Build Windows icon
        shell: bash
        run: |
          if [ -f nebbie-qt/icons/nebbieedit.ico ]; then
            echo "Using committed nebbieedit.ico"
          else
            pip install pillow
            python scripts/generate-nebbie-icons.py nebbieedit
          fi

      - name: Build portable zip
        shell: pwsh
        run: ./scripts/package-windows-portable.ps1

      - name: Verify zip contents
        shell: pwsh
        run: |
          $zip = Get-ChildItem dist/izanagi_*_windows_portable.zip | Select-Object -First 1
          if (-not $zip) { throw "Zip not found in dist/" }
          Expand-Archive -Path $zip.FullName -DestinationPath $env:RUNNER_TEMP/izanagi-test -Force
          if (-not (Test-Path (Join-Path $env:RUNNER_TEMP/izanagi-test izanagi.exe))) {
            throw "izanagi.exe missing in zip"
          }
          $nebbieditCount = @(Get-ChildItem -Path $env:RUNNER_TEMP/izanagi-test -Filter nebbiedit.exe -Recurse).Count
          if ($nebbieditCount -ne 1) {
            throw "Expected exactly one nebbiedit.exe (CLI) in zip, found $nebbieditCount"
          }
          if (Test-Path (Join-Path $env:RUNNER_TEMP/izanagi-test nebbieedit.exe)) {
            throw "Legacy nebbieedit.exe should not be shipped in the Windows zip"
          }

      - name: Upload zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: nebbie-editor-windows-zip
          path: dist/izanagi_*_windows_portable.zip
          if-no-files-found: error

  publish-release:
    if: github.repository == 'NebbieArcane/izanagi'
    needs: [linux-deb, macos-dmg, windows-portable]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all package artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: nebbie-editor-*
          merge-multiple: true

      - name: List release assets
        run: find release-assets -type f -print

      - name: Flatten release assets
        run: |
          set -euo pipefail
          mkdir -p release-flat
          find release-assets -type f \( -name '*.deb' -o -name '*.dmg' -o -name '*.zip' \) -exec cp -t release-flat {} +
          ls -la release-flat
          test "$(find release-flat -maxdepth 1 -type f | wc -l)" -gt 0

      - name: Publish GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/publish-github-release.sh izanagi Izanagi .github/release-notes/izanagi.md release-flat
