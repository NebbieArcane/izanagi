name: Izanagi restyle (packages)

# Solo restyle: pacchetti della nuova codebase. NON gira su main.
on:
  workflow_dispatch:
  push:
    branches: ["restyle"]
    paths:
      - ".github/workflows/packages.yml"
      - "app/**"
      - "core/**"
      - "resources/**"
      - "scripts/**"
      - "CMakeLists.txt"
      - "sample/**"

permissions:
  contents: read

env:
  NEBBIE_VERSION: 0.2.${{ github.run_number }}

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: ./scripts/install-deps.sh

      - name: Build package
        run: ./scripts/package-linux.sh

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: izanagi-linux-tar
          path: dist/izanagi_*_linux_*.tar.gz
          if-no-files-found: error

  macos-arm64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: ./scripts/install-deps.sh

      - name: Build package
        run: |
          export CMAKE_PREFIX_PATH="$(brew --prefix qt@6)"
          ./scripts/package-macos.sh

      - name: Upload macOS Apple Silicon artifact
        uses: actions/upload-artifact@v4
        with:
          name: izanagi-macos-arm64-dmg
          path: dist/izanagi_*_macos_arm64.dmg
          if-no-files-found: error

  macos-intel:
    # Runner Intel dedicato (non Apple Silicon).
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: ./scripts/install-deps.sh

      - name: Build package
        run: |
          export CMAKE_PREFIX_PATH="$(brew --prefix qt@6)"
          ./scripts/package-macos.sh

      - name: Upload macOS Intel artifact
        uses: actions/upload-artifact@v4
        with:
          name: izanagi-macos-intel-dmg
          path: dist/izanagi_*_macos_x86_64.dmg
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          # 6.5.3 + MSVC recente fallisce su stdext in qvarlengtharray.h.
          # Qt 6.8 LTS usa solo binari MSVC 2022.
          version: "6.8.*"
          host: windows
          target: desktop
          arch: win64_msvc2022_64

      - name: Build package
        shell: pwsh
        run: ./scripts/package-windows.ps1

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: izanagi-windows-zip
          path: dist/izanagi_*_windows_portable.zip
          if-no-files-found: error
