name: Nebbie Translate (release packages)

on:
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  linux-deb:
    if: github.repository == 'NebbieArcane/izanagi'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch nebbietest data
        run: ./scripts/fetch-test-data.sh

      - name: Install dependencies
        run: ./scripts/install-deps.sh

      - name: Build .deb package
        run: ./scripts/package-deb-translate.sh

      - name: Verify .deb package
        run: |
          dpkg-deb --info dist/cypher_*.deb
          dpkg-deb --contents dist/cypher_*.deb | grep -E 'bin/nebbie-translate|share/nebbie-translate|icons/hicolor.*cypher'

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: nebbie-translate-linux-deb
          path: dist/cypher_*.deb
          if-no-files-found: error

  macos-dmg:
    if: github.repository == 'NebbieArcane/izanagi'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch nebbietest data
        run: ./scripts/fetch-test-data.sh

      - name: Install dependencies
        run: ./scripts/install-deps.sh

      - name: Build app icons
        run: |
          if [[ -f nebbie-translator/icons/nebbie-translate.icns ]]; then
            echo "Using committed nebbie-translate.icns"
          else
            pip3 install pillow --break-system-packages
            python3 scripts/generate-nebbie-icons.py nebbie-translate
          fi

      - name: Detect Apple signing configuration
        id: apple_signing
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
        run: |
          if [[ -n "${APPLE_TEAM_ID}" && -n "${APPLE_CERTIFICATE_BASE64}" \
                && -n "${APPLE_ID}${APP_STORE_CONNECT_API_KEY_ID}" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Apple notarization secrets found — will sign with Developer ID."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Apple secrets not configured — building ad-hoc signed DMG."
            echo "Optional notarization setup: docs/MACOS_SIGNING.md"
          fi

      - name: Import Apple signing certificate
        if: steps.apple_signing.outputs.enabled == 'true'
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: ./scripts/macos-import-signing-cert.sh

      - name: Build .dmg package
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          export CMAKE_PREFIX_PATH="$(brew --prefix qt@6)"
          ./scripts/package-dmg-translate.sh

      - name: Verify .dmg contents
        run: |
          hdiutil attach dist/cypher_*_macos.dmg -mountpoint /tmp/cypher-dmg -nobrowse
          test -d /tmp/cypher-dmg/nebbie-translate.app
          test -d /tmp/cypher-dmg/nebbie-translate.app/Contents/Frameworks
          test -x /tmp/cypher-dmg/nebbie-translate.app/Contents/MacOS/nebbie-translate
          if [[ "${{ steps.apple_signing.outputs.enabled }}" == "true" ]]; then
            xcrun stapler validate /tmp/cypher-dmg/nebbie-translate.app
            spctl -a -vv /tmp/cypher-dmg/nebbie-translate.app
          else
            echo "Ad-hoc signed build — skipping stapler/spctl (first launch: tasto destro → Apri)."
          fi
          hdiutil detach /tmp/cypher-dmg

      - name: Upload .dmg artifact
        uses: actions/upload-artifact@v4
        with:
          name: nebbie-translate-macos-dmg
          path: dist/cypher_*_macos.dmg
          if-no-files-found: error

  windows-portable:
    if: github.repository == 'NebbieArcane/izanagi'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch nebbietest data
        shell: pwsh
        run: ./scripts/fetch-test-data.ps1

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.5.3"
          host: windows
          target: desktop
          arch: win64_msvc2019_64

      - name: Build portable zip
        shell: pwsh
        run: ./scripts/package-windows-translate.ps1

      - name: Verify zip contents
        shell: pwsh
        run: |
          $zip = Get-ChildItem dist/cypher_*_windows_portable.zip | Select-Object -First 1
          if (-not $zip) { throw "Zip not found in dist/" }
          Expand-Archive -Path $zip.FullName -DestinationPath $env:RUNNER_TEMP/cypher-test -Force
          if (-not (Test-Path (Join-Path $env:RUNNER_TEMP/cypher-test cypher.exe))) {
            throw "cypher.exe missing in zip"
          }
          if (Test-Path (Join-Path $env:RUNNER_TEMP/cypher-test nebbie-translate.exe)) {
            throw "Legacy nebbie-translate.exe should not be shipped in the Windows zip"
          }

      - name: Upload zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: nebbie-translate-windows-zip
          path: dist/cypher_*_windows_portable.zip
          if-no-files-found: error

  publish-release:
    if: github.repository == 'NebbieArcane/izanagi'
    needs: [linux-deb, macos-dmg, windows-portable]
    runs-on: ubuntu-latest
    steps:
      - name: Download all package artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: nebbie-translate-*
          merge-multiple: true

      - name: List release assets
        run: find release-assets -type f -print

      - name: Publish GitHub pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: cypher
          name: Cypher
          prerelease: true
          generate_release_notes: true
          files: |
            release-assets/**/*.deb
            release-assets/**/*.dmg
            release-assets/**/*.zip
          body: |
            ## Cypher

            Editor leggero per tradurre **nome stanza**, **descrizione**, **descrizioni extra** e **testi look uscite** (cypher / nebbie-translate).

            Scarica il pacchetto per la tua piattaforma (nessuna compilazione).

            | Piattaforma | File |
            |-------------|------|
            | **Windows** | `cypher_*_windows_portable.zip` — estrai e avvia `cypher.exe` |
            | **macOS** | `cypher_*_macos.dmg` — trascina `nebbie-translate.app` in Applicazioni |
            | **Linux** | `cypher_*_amd64.deb` — `sudo dpkg -i …` poi `sudo apt-get install -f` |

            **macOS — primo avvio:** se macOS blocca l'app, tasto destro → **Apri** (prima volta),
            oppure `xattr -cr /Applications/nebbie-translate.app` (vedi `LEGGIMI.txt` nel DMG).
            Per aprirla senza questo passaggio serve la notarizzazione Apple (`docs/MACOS_SIGNING.md`).

            ### Primo avvio
            1. Avvia **Cypher** (`cypher.exe`)
            2. **File → Apri libreria** → cartella `mudroot` o `mudroot/lib`
            3. Modifica i testi → **Salva**

            Ogni pacchetto include un mondo di esempio (`sample-mudroot`).

            ### Config
            - Linux: `~/.config/Nebbie/nebbie-translate.conf`
            - macOS: `~/Library/Application Support/Nebbie/nebbie-translate.conf`
            - Windows: `%APPDATA%\Nebbie\nebbie-translate.conf`
