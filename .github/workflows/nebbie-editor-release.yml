name: Nebbie Editor (release packages)

on:
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  linux-deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch nebbietest data
        run: ./scripts/fetch-test-data.sh

      - name: Install dependencies
        run: ./scripts/install-deps.sh

      - name: Build .deb package
        run: ./scripts/package-deb.sh

      - name: Verify .deb package
        run: |
          dpkg-deb --info dist/nebbie-editor_*.deb
          dpkg-deb --contents dist/nebbie-editor_*.deb | grep -E 'bin/nebbieedit|share/nebbie-editor'

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: nebbie-editor-linux-deb
          path: dist/nebbie-editor_*.deb
          if-no-files-found: error

  macos-dmg:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch nebbietest data
        run: ./scripts/fetch-test-data.sh

      - name: Install dependencies
        run: ./scripts/install-deps.sh

      - name: Build app icons
        run: |
          if [[ -f nebbie-qt/icons/nebbieedit.icns ]]; then
            echo "Using committed nebbieedit.icns"
          else
            pip3 install pillow --break-system-packages
            python3 scripts/generate-nebbie-icons.py nebbieedit
          fi

      - name: Detect Apple signing configuration
        id: apple_signing
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
        run: |
          if [[ -n "${APPLE_TEAM_ID}" && -n "${APPLE_CERTIFICATE_BASE64}" \
                && -n "${APPLE_ID}${APP_STORE_CONNECT_API_KEY_ID}" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Apple notarization secrets found — will sign with Developer ID."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Apple secrets not configured — building ad-hoc signed DMG."
            echo "Optional notarization setup: docs/MACOS_SIGNING.md"
          fi

      - name: Import Apple signing certificate
        if: steps.apple_signing.outputs.enabled == 'true'
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: ./scripts/macos-import-signing-cert.sh

      - name: Build .dmg package
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          export CMAKE_PREFIX_PATH="$(brew --prefix qt@6)"
          ./scripts/package-dmg.sh

      - name: Verify .dmg contents
        run: |
          set -euo pipefail
          hdiutil attach dist/nebbie-editor_*_macos.dmg -mountpoint /tmp/nebbie-editor-dmg -nobrowse
          trap 'hdiutil detach /tmp/nebbie-editor-dmg 2>/dev/null || true' EXIT
          test -d /tmp/nebbie-editor-dmg/nebbieedit.app
          test -d /tmp/nebbie-editor-dmg/nebbieedit.app/Contents/Frameworks
          test -x /tmp/nebbie-editor-dmg/nebbieedit.app/Contents/MacOS/nebbieedit
          test -f /tmp/nebbie-editor-dmg/LEGGIMI.txt
          if [[ "${{ steps.apple_signing.outputs.enabled }}" == "true" ]]; then
            xcrun stapler validate /tmp/nebbie-editor-dmg/nebbieedit.app
            spctl -a -vv /tmp/nebbie-editor-dmg/nebbieedit.app
          else
            echo "Ad-hoc signed build — skipping stapler/spctl (first launch: tasto destro → Apri)."
          fi

      - name: Upload .dmg artifact
        uses: actions/upload-artifact@v4
        with:
          name: nebbie-editor-macos-dmg
          path: dist/nebbie-editor_*_macos.dmg
          if-no-files-found: error

  windows-portable:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch nebbietest data
        shell: pwsh
        run: ./scripts/fetch-test-data.ps1

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.5.3"
          host: windows
          target: desktop
          arch: win64_msvc2019_64

      - name: Build Windows icon
        shell: bash
        run: |
          if [ -f nebbie-qt/icons/nebbieedit.ico ]; then
            echo "Using committed nebbieedit.ico"
          else
            pip install pillow
            python scripts/generate-nebbie-icons.py nebbieedit
          fi

      - name: Build portable zip
        shell: pwsh
        run: ./scripts/package-windows-portable.ps1

      - name: Verify zip contents
        shell: pwsh
        run: |
          $zip = Get-ChildItem dist/nebbie-editor_*_windows_portable.zip | Select-Object -First 1
          if (-not $zip) { throw "Zip not found in dist/" }
          Expand-Archive -Path $zip.FullName -DestinationPath $env:RUNNER_TEMP/nebbie-editor-test -Force
          if (-not (Test-Path (Join-Path $env:RUNNER_TEMP/nebbie-editor-test nebbieedit.exe))) {
            throw "nebbieedit.exe missing in zip"
          }

      - name: Upload zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: nebbie-editor-windows-zip
          path: dist/nebbie-editor_*_windows_portable.zip
          if-no-files-found: error

  publish-release:
    needs: [linux-deb, macos-dmg, windows-portable]
    runs-on: ubuntu-latest
    steps:
      - name: Download all package artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: nebbie-editor-*
          merge-multiple: true

      - name: List release assets
        run: find release-assets -type f -print

      - name: Publish GitHub pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nebbie-editor
          name: Nebbie Editor
          prerelease: true
          generate_release_notes: true
          files: |
            release-assets/**/*.deb
            release-assets/**/*.dmg
            release-assets/**/*.zip
          body: |
            ## Nebbie Editor

            Editor completo del mondo Nebbie: stanze, mob, oggetti, zone, mappe, dati mondo e validazione.

            Scarica il pacchetto per la tua piattaforma (nessuna compilazione).

            | Piattaforma | File |
            |-------------|------|
            | **Windows** | `nebbie-editor_*_windows_portable.zip` — estrai e avvia `nebbieedit.exe` |
            | **macOS** | `nebbie-editor_*_macos.dmg` — trascina `nebbieedit.app` in Applicazioni |
            | **Linux** | `nebbie-editor_*_amd64.deb` — `sudo dpkg -i …` poi `sudo apt-get install -f` |

            **macOS — primo avvio:** se macOS blocca l'app, tasto destro → **Apri** (prima volta),
            oppure `xattr -cr /Applications/nebbieedit.app` (vedi `LEGGIMI.txt` nel DMG se presente).
            Per aprirla senza questo passaggio serve la notarizzazione Apple (`docs/MACOS_SIGNING.md`).

            ### Primo avvio
            1. Avvia **Nebbie Editor**
            2. **File → Apri libreria** → cartella `mudroot` o `mudroot/lib`
            3. Modifica e **Salva**

            Ogni pacchetto include un mondo di esempio (`sample-mudroot`).

            ### Config
            - Linux: `~/.config/Nebbie/nebbieedit.conf`
            - macOS: `~/Library/Application Support/Nebbie/nebbieedit.conf`
            - Windows: `%APPDATA%\Nebbie\nebbieedit.conf`
